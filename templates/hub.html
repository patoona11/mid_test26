<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เลือกระบบสอบ | Midterm Quiz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .hub-container {
            max-width: 800px;
            margin: 4rem auto;
            text-align: center;
        }
        .subject-cards {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            margin-top: 3rem;
        }
        .subject-card {
            background: white;
            padding: 3rem 2rem;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(255, 154, 158, 0.2);
            border: 4px solid #fad0c4;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .subject-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(255, 154, 158, 0.4);
            border-color: #ff9a9e;
        }
        .subject-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .subject-title {
            font-size: 1.8rem;
            font-family: 'Mali', cursive;
            font-weight: 700;
            color: #ff6b81;
            margin-bottom: 0.5rem;
        }
        .subject-subtitle {
            font-size: 1.2rem;
            color: #777;
        }
    </style>
</head>
<body class="login-body">
    <div class="hub-container">
        <h1 class="candy-title">ยินดีต้อนรับสู่ระบบสอบออนไลน์ 🎓</h1>
        <p style="font-size: 1.2rem; color: #666;">กรุณาคลิกเลือกวิชาที่คุณต้องการทำแบบทดสอบด้านล่างนี้</p>
        
        <div class="subject-cards">
            <a href="{{ url_for('login', subject='1') }}" class="subject-card">
                <div class="subject-icon">📘</div>
                <div class="subject-title">การประยุกต์ใช้เทคโนโลยีดิจิทัลในอาชีพ</div>
                <div class="subject-subtitle">Application of literacy for Career</div>
            </a>
            
            <a href="{{ url_for('login', subject='2') }}" class="subject-card">
                <div class="subject-icon">📗</div>
                <div class="subject-title">การใช้เทคโนโลยีดิจิทัลเพื่ออาชีพ</div>
                <div class="subject-subtitle">Digital literacy for Career</div>
            </a>
        </div>
    </div>
</body>
</html>

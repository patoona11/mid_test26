<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลการทำแบบทดสอบ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
    <div class="login-container result-container">
        <div class="score-card">
            <h1 class="candy-title">เสร็จสิ้นการทดสอบ!</h1>
            <p class="student-info">คุณ {{ student_name }}</p>
            <div class="score-display">
                <span class="score">{{ score }}</span>
                <span class="divider">/</span>
                <span class="total">{{ total }}</span>
            </div>
            <p class="time-taken">เวลาที่ใช้ทำข้อสอบ: <strong>{{ time_taken }}</strong></p>
            
            {% if score == total %}
            <p class="congrats">ยอดเยี่ยมมาก!</p>
            {% endif %}
        </div>
        
        <div class="result-actions">
            <a href="{{ url_for('index') }}" class="btn btn-outline">กลับสู่หน้าแรก</a>
        </div>
    </div>
</body>
</html>
